<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downstream Planning</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/forward.js"></script>
</head>
<body>
<div class="authwrap">
  <header class="hero">
    <div class="brandRow">
      <div class="logoCard"><img src="assets/logo.png" alt="Logo"></div>
      <div><h1>Downstream Planning</h1><p class="sub" style="margin:0">Lane planning and LH approval</p></div>
    </div>
  </header>
  <section class="panel">
    <h2 style="margin:0 0 4px">Planner (DC)</h2>
    <p class="hint">Upload data, build the lane plan, save drafts and submit for LH approval.</p>
    <a class="btn primary" style="display:inline-block;text-decoration:none;padding:8px 14px;border-radius:999px" href="login.html">User login →</a>

  <section class="panel">
    <h2 style="margin:0 0 4px">LH team (Admin)</h2>
    <p class="hint">Review, edit, comment on, approve and publish submitted plans.</p>
    <a class="btn" style="display:inline-block;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink)" href="admin-login.html">Admin login →</a>
  </section>
