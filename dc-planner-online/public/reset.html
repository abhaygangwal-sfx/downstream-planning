<!doctype html>
<html lang="en" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set password · Downstream Planning</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="authwrap">
  <header class="hero">
    <div class="brandRow">
      <div class="logoCard"><img src="assets/logo.png" alt="Logo"></div>
      <div><h1>Downstream Planning</h1><p class="sub" style="margin:0">Set your password</p></div>
    </div>
  </header>
  <section class="panel">
    <form id="resetForm" novalidate>
      <h2 style="margin:0 0 4px">Choose a password</h2>
      <p class="hint" id="resetWho">Checking your link…</p>
      <label for="pw1">New password (at least 8 characters)</label>
      <input type="password" id="pw1" autocomplete="new-password" minlength="8" required>
      <label for="pw2">Repeat password</label>
      <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
      <div class="row" style="margin-top:16px"><button class="btn primary" type="submit" id="resetBtn">Save password</button></div>
      <div class="err" id="resetErr" role="alert"></div>
      <div class="ok" id="resetOk" role="status"></div>
    </form>
    <p class="switch"><a href="login.html">Back to sign in</a></p>
  </section>
</div>
<script src="config.js"></script>
<script type="module" src="assets/reset.js"></script>
</body>
</html>
